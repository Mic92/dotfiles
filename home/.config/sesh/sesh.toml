#:schema https://github.com/joshmedeski/sesh/raw/main/sesh.schema.json
# sesh — tmux session manager
# Sources: running tmux sessions + zoxide dirs. Keybind: prefix+s in tmux.

cache = true

[default_session]
preview_command = "git -C {} -c color.ui=always status -sb && git -C {} log --oneline -8 --color=always"

# Start the pi coding agent in project directories.
[[wildcard]]
pattern = "~/git/**"
startup_command = "pi"

[[wildcard]]
pattern = "~/src/**"
startup_command = "pi"
